name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (tag -> sha resolved via the GitHub ref API):
      #   actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Generate release notes from CHANGELOG
        run: |
          TAG=${GITHUB_REF_NAME}
          VER=${GITHUB_REF_NAME#v}   # CHANGELOG guna [1.2.3] tanpa 'v'
          if [ -f CHANGELOG.md ]; then
            awk -v tag="$VER" -v tagv="$TAG" '
              ($0 ~ "## \\[" tagv || $0 ~ "## \\[" tag) {found=1; next}
              found && /^## \[/ {exit}
              found {print}
            ' CHANGELOG.md > release_notes.md
            [ -s release_notes.md ] || echo "Release $TAG" > release_notes.md
          else
            echo "Release $TAG" > release_notes.md
          fi

      #   softprops/action-gh-release v2
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: release_notes.md
          generate_release_notes: true

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      #   actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      #   docker/setup-buildx-action v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      #   docker/login-action v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      #   docker/build-push-action v6
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
